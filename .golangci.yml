# golangci-lint configuration for dit
# Configuration compatible with golangci-lint v7
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - gocyclo
    - goconst
    - whitespace
  exclusions:
    rules:
      # Test files routinely repeat fixture strings ("alice", "email",
      # "/var/lib/postgresql/data" etc.) for readability. Forcing them
      # into shared constants makes tests harder to read in isolation
      # and couples unrelated test cases. Skip goconst there.
      - path: _test\.go
        linters:
          - goconst