tests:
  - "can install datadatdat":
      command: d3 install
      wait: 20
#      stdout:
#        contains: Datadatdat CLI successfully installed, happy data versioning :)
  - "d3 server is running":
      command: docker inspect --type container --format='{{.State.Status}}' datadatdat-docker-server
      stdout:
        contains: running
  - "d3 launch is running":
      command: docker inspect --type container --format='{{.State.Status}}' datadatdat-docker-launch
      stdout:
        contains: running