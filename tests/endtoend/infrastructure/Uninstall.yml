tests:
  - "can uninstall datadatdat":
      command: d3 uninstall
      stdout:
        contains: Uninstalled datadatdat infrastructure
  - "d3 server is not running":
      command: docker inspect --type container --format='{{.State.Status}}' datadatdat-docker-server
      exitValue: 1
      stderr: "Error response from daemon: No such container: datadatdat-docker-server"
  - "d3 launch is not running":
      command: docker inspect --type container --format='{{.State.Status}}' datadatdat-docker-launch
      exitValue: 1
      stderr: "Error response from daemon: No such container: datadatdat-docker-launch"
  - "d3 docker images not removed":
      command: docker inspect --type image --format='{{.RepoTags}}' datadatdat:latest
      stdout:
        contains: datadatdat:latest
  - "re-install datadatdat":
      command: d3 install
  - "can uninstall d3 and remove docker images":
      command: d3 uninstall --remove-images
      stdout:
        contains: Removing Datadatdat Docker image
