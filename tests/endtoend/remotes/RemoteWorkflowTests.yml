tests:
  - "$REMOTE > remote > add":
      command: d3 remote add -r $REMOTE $URI $REPO
      env:
        get:
          - URI
          - REPO
          - REMOTE
  - "$REMOTE > remote > ls > has $REMOTE":
      command: d3 remote ls $REPO
      stdout:
        contains: $URI
      env:
        get:
          - URI
          - REPO
          - REMOTE
  - "$REMOTE > commit":
      command: [d3, commit, -m, Test $REMOTE Commit, $REPO]
      stdout:
        contains: Commit
      env:
        get:
          - REPO
          - REMOTE
        set:
          - COMMIT_GUID:
              split:
                delimiter: " "
                position: 1
  - "$REMOTE > remote > log > missing commit":
      command: d3 remote log $REPO
      stdout:
        excludes: Commit $COMMIT_GUID
      env:
        get:
          - COMMIT_GUID
          - REPO
          - REMOTE
  - "$REMOTE > push":
      command: [d3, push, -r, $REMOTE, -c, $COMMIT_GUID, $REPO]
      stdout:
        contains:
          - Pushing $COMMIT_GUID to '$REMOTE'
          - Push completed successfully
      env:
        get:
          - COMMIT_GUID
          - REPO
          - REMOTE
  - "$REMOTE > remote > log > has commit":
      command: d3 remote log $REPO
      stdout:
        contains: Commit $COMMIT_GUID
      env:
        get:
          - COMMIT_GUID
          - URI
          - REPO
          - REMOTE
after:
  clearVars: true