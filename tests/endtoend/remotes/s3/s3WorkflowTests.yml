tests:
  - "can clone hello-world/postgres":
      command: d3 clone -n hello-world s3web://demo.datadatdat.com/hello-world/postgres
      stdout:
        contains:
          - Running controlled container hello-world
          - Starting container hello-world
files:
  - ../RemoteWorkflowTests.yml:
      parameters:
        REMOTE: s3
        URI: s3://datadatdat-testdata/e2etest
        REPO: hello-world
  - s3Cleanup.yml:
      parameters:
        REMOTE: s3
        URI: s3://datadatdat-testdata/e2etest
        REPO: hello-world
after:
  clearVars: true
