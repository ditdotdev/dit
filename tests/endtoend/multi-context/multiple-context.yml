tests:
  - "can install context one":
      command: d3 context install -n one -t docker
      wait: 10
      stdout:
        contains: Datadatdat CLI successfully installed, happy data versioning :)
  - "can install context two":
      command: d3 context install -n two -t docker
      wait: 10
      stdout:
        contains: Datadatdat CLI successfully installed, happy data versioning :)
  - "can run mongo":
      command: d3 run -P mongo
      wait: 5
      stdout:
        contains: Running controlled container mongo
  - "can get status of one/mongo":
      command: d3 status one/mongo
  - "can run two/mongo-alt":
      command: d3 run -P -n two/mongo-alt mongo
      wait: 5
      stdout:
        contains: Running controlled container mongo-alt
  - "can change default context":
      command: d3 context default two
  - "default context is two":
      command: d3 context default
      stdout: two
  - "can get status of mongo-alt":
      command: d3 status mongo-alt
  - "can remove one/mongo":
      command: d3 rm -f one/mongo
      stdout:
        contains: mongo removed
  - "can remove mongo-alt":
      command: d3 rm -f mongo-alt
      stdout:
        contains: mongo-alt removed
  - "can uninstall context one":
      command: d3 context uninstall one
      stdout:
        contains: Uninstalled d3 infrastructure
  - "can uninstall context two":
      command: d3 context uninstall two
      stdout:
        contains: Uninstalled d3 infrastructure
after:
  clearVars: true
