name: End to End Test

on:
  schedule:
    # Weekly on Sunday at 03:30 UTC (was daily — #144). The CLI E2E pulls
    # the ditdotdev/dit server image which only changes on
    # tagged releases; daily cadence was over-spending vs the regression
    # signal it produced. Manual dispatch still available for ad-hoc runs.
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}
          fetch-depth: 0
      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com" > ~/.git-credentials
        shell: bash
      - name: Config Git
        run: |
          git config --global user.name "test.runner"
          git config --global user.email "test@runner.com"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
      - name: Configure Go for private modules
        run: |
          go env -w GOPRIVATE=github.com/ditdotdev/*
          go env -w GONOPROXY=github.com/ditdotdev/*
          go env -w GONOSUMDB=github.com/ditdotdev/*
          go env -w GOPROXY=https://proxy.golang.org,direct
        shell: bash
        env:
          GOPRIVATE: github.com/ditdotdev/*
          GONOPROXY: github.com/ditdotdev/*
          GONOSUMDB: github.com/ditdotdev/*
      - name: Output Kernel Info
        run: |
         docker pull busybox
         docker run busybox uname -a
      - name: Build Dit
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "Building dit CLI with version: $VERSION"
          make build VERSION=$VERSION
        shell: bash
        env:
          GOPRIVATE: github.com/ditdotdev/*
          GONOPROXY: github.com/ditdotdev/*
          GONOSUMDB: github.com/ditdotdev/*
          GIT_TERMINAL_PROMPT: 0
      - name: Install OpenZFS
        run: |
          echo "Installing ZFS for Ubuntu $(lsb_release -rs) kernel $(uname -r)..."
          sudo apt-get update
          
          echo "Installing ZFS userspace tools and kernel modules..."
          sudo apt-get install -y zfsutils-linux
          
          echo "Loading ZFS kernel modules..."
          sudo modprobe zfs
          
          echo "Verifying ZFS installation..."
          zfs version
          zpool version
          lsmod | grep zfs
          
          echo "Testing ZFS functionality..."
          # Create a test file for ZFS pool
          sudo dd if=/dev/zero of=/tmp/zfs-test-file bs=1M count=100
          sudo zpool create testpool /tmp/zfs-test-file
          sudo zfs create testpool/testfs
          sudo zfs list
          sudo zpool destroy testpool
          sudo rm -f /tmp/zfs-test-file  # Use sudo for cleanup
          echo "ZFS installation and test completed successfully!"
      
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove unnecessary preinstalled software
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h
      
      - name: Setup Test Requirements
        run: |
          # Install BATS test framework
          sudo npm install -g bats
          bats --version

          # Copy build/dit to dit
          cp build/dit dit

          # Generate SSH keys using the project's generateKey.sh script
          cd tests/endtoend/remotes/ssh
          ./generateKey.sh ubuntu-22.04

      # Local kubernetes cluster for the kubernetes-tests.bats suite that
      # `make e2e` now includes. The suite auto-skips when the cluster is
      # absent, but we want this workflow to actually exercise the k8s
      # provider end-to-end.
      #
      # driver=none (kubeadm directly on the runner host) instead of the
      # docker driver: the docker driver runs the apiserver inside a
      # container on minikube's private network (192.168.49.2:8443),
      # which the dit server container — running on its own docker bridge
      # — has no route to. CreateVolume / CreatePVC then fails with a
      # 500 from inside the dit server. driver=none puts the apiserver on
      # the host network where every container can reach it.
      - name: Setup minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: none

      - name: Verify kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # Enable CSI snapshot support so kubernetes-tests.bats can exercise
      # `dit commit` in the scheduled E2E. See pull-request.yml for the
      # longer rationale.
      - name: Enable CSI volume snapshots in minikube
        run: |
          minikube addons enable volumesnapshots
          minikube addons enable csi-hostpath-driver
          kubectl patch storageclass standard -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
          kubectl patch storageclass csi-hostpath-sc -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
          # csi-hostpath-snapclass also needs the default-class annotation
          # for dit's commitVolume to find a snapshot class. See
          # pull-request.yml for the longer rationale.
          kubectl patch volumesnapshotclass csi-hostpath-snapclass --type=merge -p '{"metadata":{"annotations":{"snapshot.storage.kubernetes.io/is-default-class":"true"}}}'

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      # Authenticate to Docker Hub so 'dit install' can pull ditdotdev/* images
      # without hitting the anonymous pull rate-limit on shared runner IPs (#167).
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run Test Suite
        run: |
          export PATH=$GITHUB_WORKSPACE/build:$PATH
          make e2e
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Unique S3 namespace per run to avoid collisions. See issue #118.
          E2E_RUN_SUFFIX: run-${{ github.run_id }}-${{ github.run_attempt }}

      # Show container and k8s logs on every run: matches the dump in
      # pull-request.yml so the scheduled E2E leaves behind the same
      # triage baseline. Always-on (not failure-only) so passing runs
      # produce a known-good reference for diffing against the next
      # failure — silent regressions in server logs surface here.
      - name: Show container and k8s logs
        if: always()
        run: |
          for c in $(docker ps -a --filter "name=dit" --format '{{.Names}}'); do
            echo "=== docker logs $c ==="
            docker logs "$c" 2>&1 | tail -200 || true
          done
          if kubectl cluster-info >/dev/null 2>&1; then
            echo "=== kubectl get all -A ==="
            kubectl get all -A || true
            echo "=== kubectl get pvc -A ==="
            kubectl get pvc -A || true
            echo "=== kubectl get storageclass ==="
            kubectl get storageclass || true
            echo "=== kubectl get events -A --sort-by=.lastTimestamp (last 50) ==="
            kubectl get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -50 || true
          fi
        shell: bash

      - name: Cleanup run-specific S3 prefixes
        if: always()
        run: |
          aws s3 rm "s3://demo-ditdotdev/simple-test/run-${{ github.run_id }}-${{ github.run_attempt }}" --recursive || true
          aws s3 rm "s3://dit-testdata/e2etest/run-${{ github.run_id }}-${{ github.run_attempt }}" --recursive || true
          aws s3 rm "s3://dit-testdata/e2etest-pushpull/run-${{ github.run_id }}-${{ github.run_attempt }}" --recursive || true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Cleanup Docker resources
        if: always()
        run: |
          echo "Cleaning up Docker resources..."
          docker system prune -af --volumes
          df -h
