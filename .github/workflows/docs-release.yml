name: Push to Release Docs
on: create

permissions:
  contents: read

jobs:
  build:
    name: Build Documentation
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure GitHub SSH access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install virtualenv
        run: sudo pip3 install virtualenv
      - name: Build documentation
        run: |
          export PATH=/usr/local/bin:$PATH
          ./docs/build.sh -r official -v ${GITHUB_REF#refs/tags/}
      - name: Clone datadatdat.github.io
        run: |
          git clone git@github.com:datadatdat/datadatdat.github.io
          cd ./datadatdat.github.io && git log -1
      - name: Configure git user
        run: |
          cd ./datadatdat.github.io
          git config user.name "datadatdat-docs"
          git config user.email "datadatdat-docs@users.noreply.github.com"
      - name: Publish docs
        run: ./docs/publish.sh -l -f -v ${GITHUB_REF#refs/tags/} ./datadatdat.github.io
      - name: Push docs
        run: |
          cd ./datadatdat.github.io
          git push
