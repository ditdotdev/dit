name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.1'
  GOPRIVATE: github.com/datadatdat/*
  GONOPROXY: github.com/datadatdat/*
  GONOSUMDB: github.com/datadatdat/*
  GOPROXY: https://proxy.golang.org,direct
  GIT_TERMINAL_PROMPT: 0

jobs:
  # Code quality and linting (fast, linux-only)
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com" > ~/.git-credentials

      - name: Download dependencies
        run: go mod download

      - name: Run gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck -checks="inherit,-SA1019" ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # Security and dependency scanning (advisory, linux-only)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com" > ~/.git-credentials

      - name: Download dependencies
        run: go mod download

      - name: Run Go security scanner (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
        continue-on-error: true

      - name: Nancy Security Scan
        uses: sonatype-nexus-community/nancy-github-action@main
        continue-on-error: true

  # Build on all platforms
  build-test:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com" > ~/.git-credentials
        shell: bash

      - name: Configure Go for private modules
        run: |
          go env -w GOPRIVATE=github.com/datadatdat/*
          go env -w GONOPROXY=github.com/datadatdat/*
          go env -w GONOSUMDB=github.com/datadatdat/*
          go env -w GOPROXY=https://proxy.golang.org,direct
        shell: bash

      - name: Build
        run: make build
        shell: bash

  # End-to-end tests (linux only, needs ZFS + AWS)
  e2e-test:
    name: End to End Tests
    runs-on: ubuntu-22.04
    # Serialize E2E across all PRs: the BATS suite uses shared S3 paths
    # (e.g. s3://demo-datadatdat/simple-test, s3://datadatdat-testdata/e2etest)
    # so concurrent runs corrupt each other's data. See issue #118.
    concurrency:
      group: e2e-test-shared-s3
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com" > ~/.git-credentials
          git config --global user.name "test.runner"
          git config --global user.email "test@runner.com"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Go for private modules
        run: |
          go env -w GOPRIVATE=github.com/datadatdat/*
          go env -w GONOPROXY=github.com/datadatdat/*
          go env -w GONOSUMDB=github.com/datadatdat/*
          go env -w GOPROXY=https://proxy.golang.org,direct

      - name: Build Datadatdat
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "Building d3 CLI with version: $VERSION"
          make build VERSION=$VERSION
          cp build/d3 d3
          echo "d3 binary copied to root directory"

      - name: Install OpenZFS
        run: |
          echo "Installing ZFS for Ubuntu $(lsb_release -rs) kernel $(uname -r)..."
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          zfs version
          zpool version
          lsmod | grep zfs
          # Quick sanity test
          sudo dd if=/dev/zero of=/tmp/zfs-test-file bs=1M count=100
          sudo zpool create testpool /tmp/zfs-test-file
          sudo zfs create testpool/testfs
          sudo zfs list
          sudo zpool destroy testpool
          sudo rm -f /tmp/zfs-test-file
          echo "ZFS installation and test completed successfully!"

      - name: Install BATS
        run: |
          sudo npm install -g bats
          bats --version

      - name: Setup Test Requirements
        run: |
          cd tests/endtoend/remotes/ssh
          ./generateKey.sh ubuntu-22.04

      - name: Run Test Suite
        run: |
          export PATH=$GITHUB_WORKSPACE/build:$PATH
          make e2e
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  # Documentation build
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - name: Install virtualenv
        run: sudo pip3 install virtualenv

      - name: Build documentation
        run: |
          export PATH=/usr/local/bin:$PATH
          ./docs/build.sh -r development -v development
