name: Database Matrix Tests

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

jobs:
  db-matrix:
    name: Test ${{ matrix.database }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        database:
    
        # Amazon DynamoDB
        # https://hub.docker.com/r/datadatdat/dynamodb-local
        # Wrapped versions of amazon/dynamodb-local with VOLUME directives
        # Source Dockerfiles: tests/endtoend/db-matrix/dynamodb-local-*.Dockerfile
        - datadatdat/dynamodb-local:latest
        - datadatdat/dynamodb-local:3.1.0
        - datadatdat/dynamodb-local:3.0.0
        - datadatdat/dynamodb-local:2.6.1
        - datadatdat/dynamodb-local:2.5.4

        # Apache Cassandra
        # https://hub.docker.com/_/cassandra
        - cassandra:5
        - cassandra:4
        - cassandra:4.0
        - cassandra:3.11
        - cassandra:3.0

        # Apache Hive
        # Not sure if this makes sense. 

        # Databricks
        # managed database service; no official DB server image on Docker Hub

        # Elasticsearch
        # https://hub.docker.com/r/datadatdat/elasticsearch
        # Wrapped versions of elasticsearch with VOLUME directives
        # Source Dockerfiles: tests/endtoend/db-matrix/elasticsearch-*.Dockerfile
        - datadatdat/elasticsearch:8.18.8
        - datadatdat/elasticsearch:8.19.7
        - datadatdat/elasticsearch:9.1.7
        - datadatdat/elasticsearch:9.2.1

        # Google BigQuery
        # Managed cloud service; no official DB server image on Docker Hub

        # IBM Db2
        - icr.io/db2_community/db2:latest
        - icr.io/db2_community/db2:12.1.3.0
        - icr.io/db2_community/db2:11.5.9.0
        - icr.io/db2_community/db2:11.5.8.0
        - icr.io/db2_community/db2:11.5.5.1

        # MariaDB
        # https://hub.docker.com/_/mariadb
        - mariadb:12
        - mariadb:11
        - mariadb:11.4
        - mariadb:10

        # Microsoft Access
        # Yeah, we aren't doing this one.

        # Microsoft Azure SQL DB
        # Cloud DB service; no official DB server image on Docker Hub

        # Microsoft SQL Server
        # https://hub.docker.com/r/datadatdat/mssql-server
        # Wrapped versions of mcr.microsoft.com/mssql/server with VOLUME directives
        # Source Dockerfiles: tests/endtoend/db-matrix/mssql-*.Dockerfile
        - datadatdat/mssql-server:2025
        - datadatdat/mssql-server:2022
        - datadatdat/mssql-server:2019
        - datadatdat/mssql-server:2017

        # MongoDB
        - mongo:latest
        - mongo:8
        - mongo:8.0
        - mongo:7
        - mongo:6

        # MySQL
        - mysql:9
        - mysql:8
        - mysql:8.0

        # Neo4j
        - neo4j:2025
        - neo4j:5
        - neo4j:4.4

        # Oracle
        # https://hub.docker.com/r/datadatdat/oracle-xe
        # https://hub.docker.com/r/datadatdat/oracle-free
        # Wrapped versions of gvenzl/oracle-xe and gvenzl/oracle-free with VOLUME directives
        # Source Dockerfiles: tests/endtoend/db-matrix/oracle-*.Dockerfile
        #- datadatdat/oracle-xe:latest
        #- datadatdat/oracle-xe:latest-faststart
        #- datadatdat/oracle-xe:slim
        - datadatdat/oracle-xe:slim-faststart
        #- datadatdat/oracle-xe:full
        #- datadatdat/oracle-xe:full-faststart

        #- datadatdat/oracle-xe:21
        #- datadatdat/oracle-xe:21-faststart
        #- datadatdat/oracle-xe:21-slim
        - datadatdat/oracle-xe:21-slim-faststart
        #- datadatdat/oracle-xe:21-full
        #- datadatdat/oracle-xe:21-full-faststart

        #- datadatdat/oracle-xe:18
        #- datadatdat/oracle-xe:18-faststart
        #- datadatdat/oracle-xe:18-slim
        - datadatdat/oracle-xe:18-slim-faststart
        #- datadatdat/oracle-xe:18-full
        #- datadatdat/oracle-xe:18-full-faststart

        #- datadatdat/oracle-xe:11
        #- datadatdat/oracle-xe:11-faststart
        #- datadatdat/oracle-xe:11-slim
        - datadatdat/oracle-xe:11-slim-faststart
        #- datadatdat/oracle-xe:11-full
        #- datadatdat/oracle-xe:11-full-faststart

        # https://hub.docker.com/r/gvenzl/oracle-free
        #- datadatdat/oracle-free:latest
        #- datadatdat/oracle-free:latest-faststart
        #- datadatdat/oracle-free:slim
        - datadatdat/oracle-free:slim-faststart
        #- datadatdat/oracle-free:full
        #- datadatdat/oracle-free:full-faststart
        
        #- datadatdat/oracle-free:23
        #- datadatdat/oracle-free:23-faststart
        #- datadatdat/oracle-free:23-slim
        - datadatdat/oracle-free:23-slim-faststart
        #- datadatdat/oracle-free:23-full
        #- datadatdat/oracle-free:23-full-faststart

        #- datadatdat/oracle-free:23.26.0
        #- datadatdat/oracle-free:23.26.0-faststart
        #- datadatdat/oracle-free:23.26.0-slim
        - datadatdat/oracle-free:23.26.0-slim-faststart
        #- datadatdat/oracle-free:23.26.0-full
        #- datadatdat/oracle-free:23.26.0-full-faststart

        # PostgreSQL
        - postgres:18
        - postgres:17
        - postgres:16
        - postgres:15
        - postgres:14

        # Redis
        - redis:8
        - redis:7
        - redis:7.2
        - redis:6

        # Snowflake
        # Snowflake is a managed cloud service; no official DB server image on Docker Hub (only third-party/local solutions and Snowflake’s own OCI registry for app images).

        # Splunk
        # Not a database server

        # SQLite
        # SQLite is fundamentally incompatible with datadatdat's model of versioning database servers with persistent storage.

        # Valkey
        - valkey:9
        - valkey:8
        - valkey:7       

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}
          fetch-depth: 0
      
      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com" > ~/.git-credentials
        shell: bash
      
      - name: Configure Git user
        run: |
          git config --global user.name "test.runner"
          git config --global user.email "test@runner.com"
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      
      - name: Configure Go for private repos
        run: |
          go env -w GOPRIVATE=github.com/datadatdat/*
          go env -w GONOPROXY=github.com/datadatdat/*
          go env -w GONOSUMDB=github.com/datadatdat/*
          go env -w GOPROXY=direct
        shell: bash
        env:
          GOPRIVATE: github.com/datadatdat/*
          GONOPROXY: github.com/datadatdat/*
          GONOSUMDB: github.com/datadatdat/*
      
      - name: Output Kernel Info
        run: |
          docker pull busybox
          docker run busybox uname -a
      
      - name: Build Datadatdat
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "Building d3 CLI with version: $VERSION"
          make build VERSION=$VERSION
        shell: bash
        env:
          GOPRIVATE: github.com/datadatdat/*
          GONOPROXY: github.com/datadatdat/*
          GONOSUMDB: github.com/datadatdat/*
          GIT_TERMINAL_PROMPT: 0
      
      - name: Install OpenZFS
        run: |
          echo "Installing ZFS for Ubuntu $(lsb_release -rs) kernel $(uname -r)..."
          sudo apt-get update
          
          echo "Installing ZFS userspace tools and kernel modules..."
          sudo apt-get install -y zfsutils-linux
          
          echo "Loading ZFS kernel modules..."
          sudo modprobe zfs
          
          echo "Verifying ZFS installation..."
          zfs version
          zpool version
          lsmod | grep zfs
          
          echo "Testing ZFS functionality..."
          # Create a test file for ZFS pool
          sudo dd if=/dev/zero of=/tmp/zfs-test-file bs=1M count=100
          sudo zpool create testpool /tmp/zfs-test-file
          sudo zfs create testpool/testfs
          sudo zfs list
          sudo zpool destroy testpool
          sudo rm -f /tmp/zfs-test-file
          echo "ZFS installation and test completed successfully!"
      
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove unnecessary preinstalled software to make room for database images
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h
      
      - name: Setup Test Requirements
        run: |
          # Install BATS test framework
          sudo npm install -g bats
          bats --version
          
          # Copy build/d3 to d3
          cp build/d3 d3
      
      - name: Install Datadatdat infrastructure
        run: |
          export PATH=$GITHUB_WORKSPACE/build:$PATH
          build/d3 install --verbose
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      
      - name: Run database matrix test for ${{ matrix.database }}
        run: |
          export PATH=$GITHUB_WORKSPACE/build:$PATH
          echo "Testing database: $DATABASE_VERSION"
          bats tests/endtoend/db-matrix/db-matrix.bats
        env:
          DATABASE_VERSION: ${{ matrix.database }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
      
      - name: Cleanup on failure
        if: failure()
        run: |
          export PATH=$GITHUB_WORKSPACE/build:$PATH
          build/d3 uninstall --force || true
      
      - name: Cleanup Docker resources
        if: always()
        run: |
          echo "Cleaning up Docker images and containers..."
          docker system prune -af --volumes
          df -h
