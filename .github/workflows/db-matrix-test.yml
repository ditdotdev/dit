        # SQLite
        # SQLite is fundamentally incompatible with datadatdat's model of versioning database servers with persistent storage.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com" > ~/.git-credentials
        shell: bash

      - name: Configure Git user
        run: |
          git config --global user.name "test.runner"
          git config --global user.email "test@runner.com"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'

      - name: Configure Go for private repos
        run: |
          go env -w GOPRIVATE=github.com/datadatdat/*
          go env -w GONOPROXY=github.com/datadatdat/*
          go env -w GONOSUMDB=github.com/datadatdat/*
          go env -w GOPROXY=https://proxy.golang.org,direct
        shell: bash
        env:
          GOPRIVATE: github.com/datadatdat/*
          GONOPROXY: github.com/datadatdat/*
          GONOSUMDB: github.com/datadatdat/*

      - name: Output Kernel Info
        run: |
          docker pull busybox
          docker run busybox uname -a

      - name: Build Datadatdat from source
        run: |
          VERSION=$(gh release view --json tagName -q .tagName)
          echo "Building with version: $VERSION"
          make build VERSION=$VERSION
          build/d3 --version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install OpenZFS
        run: |
          echo "Installing ZFS for Ubuntu $(lsb_release -rs) kernel $(uname -r)..."
          sudo apt-get update
          
          echo "Installing ZFS userspace tools and kernel modules..."
          sudo apt-get install -y zfsutils-linux
          
          echo "Loading ZFS kernel modules..."
          sudo modprobe zfs
          
          echo "Verifying ZFS installation..."
          zfs version
          zpool version
          lsmod | grep zfs
          
          echo "Testing ZFS functionality..."
          # Create a test file for ZFS pool
          sudo dd if=/dev/zero of=/tmp/zfs-test-file bs=1M count=100
          sudo zpool create testpool /tmp/zfs-test-file
          sudo zfs create testpool/testfs
          sudo zfs list
          sudo zpool destroy testpool
          sudo rm -f /tmp/zfs-test-file
          echo "ZFS installation and test completed successfully!"
      
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove unnecessary preinstalled software to make room for database images
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h
      
      - name: Setup Test Requirements
        run: |
          # Install BATS test framework
          sudo npm install -g bats
          bats --version
          
          # Copy build/d3 to d3
          cp build/d3 d3
      
      - name: Install Datadatdat infrastructure
        run: |
          export PATH=$GITHUB_WORKSPACE/build:$PATH
          build/d3 install --verbose

      - name: Wait for Datadatdat server to be ready
        run: |
          echo "Waiting for datadatdat-docker-server container to start..."
          timeout 120 bash -c 'until docker inspect datadatdat-docker-server --format "{{.State.Running}}" 2>/dev/null | grep -q true; do sleep 1; done'
          echo "Container is up, waiting for Java server on port 5001..."
          timeout 120 bash -c 'until docker exec datadatdat-docker-server nc -z localhost 5001 2>/dev/null; do sleep 1; done'
          echo "Datadatdat server is ready"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      
      - name: Run database matrix test for ${{ matrix.database }}
        run: |
          export PATH=$GITHUB_WORKSPACE/build:$PATH
          echo "Testing database: $DATABASE_VERSION"
          bats tests/endtoend/db-matrix/db-matrix.bats
        env:
          DATABASE_VERSION: ${{ matrix.database }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          # Unique S3 namespace per run to avoid collisions. See issue #118.
          E2E_RUN_SUFFIX: run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Cleanup run-specific S3 prefix
        if: always()
        run: |
          aws s3 rm "s3://datadatdat-testdata/e2etest/run-${{ github.run_id }}-${{ github.run_attempt }}" --recursive || true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2

      - name: Cleanup on failure
        if: failure()
        run: |
          export PATH=$GITHUB_WORKSPACE/build:$PATH
          build/d3 uninstall --force || true
      
      - name: Cleanup Docker resources
        if: always()
        run: |
          echo "Cleaning up Docker images and containers..."
          docker system prune -af --volumes
          df -h
