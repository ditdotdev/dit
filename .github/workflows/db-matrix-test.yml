name: Database Matrix Tests

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

jobs:
  db-matrix:
    name: Test ${{ matrix.database }}
    runs-on: ubuntu-22.04
