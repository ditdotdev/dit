name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
      
      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
      
      - name: Configure Go for private modules
        run: |
          go env -w GOPRIVATE=github.com/datadatdat/*
          go env -w GONOPROXY=github.com/datadatdat/*
          go env -w GONOSUMDB=github.com/datadatdat/*
          go env -w GOPROXY=https://proxy.golang.org,direct
      
      - name: Build cross-platform releases
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          make clean
          VERSION=$VERSION make release
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          retention-days: 1
  
  e2e-test:
    name: End-to-End Tests
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release/
      
      - name: Extract Linux binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd release/linux-amd64
          tar -xf datadatdat-cli-$VERSION-linux_amd64.tar
          chmod +x d3
          ./d3 --version
          # Create symlink in repo root for tests (they expect $REPO_ROOT/d3)
          cd ../..
          ln -s release/linux-amd64/d3 d3
      
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove unnecessary preinstalled software
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h
      
      - name: Install BATS
        run: sudo npm install -g bats
      
      - name: Install OpenZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
      
      - name: Setup ZFS pools
        run: |
          cd cleanslate
          sudo bash setup-zfs-pools.sh
      
      - name: Generate SSH test keys
        run: |
          cd tests/endtoend/remotes/ssh
          bash generateKey.sh ubuntu-22.04
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Run E2E tests
        run: |
          export PATH=$PWD/release/linux-amd64:$PATH
          make e2e
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
      
      - name: Dump server container logs
        if: failure()
        run: |
          echo "=== datadatdat-docker-server logs ==="
          docker logs datadatdat-docker-server 2>&1 || echo "No server container found"
          echo ""
          echo "=== datadatdat-docker-launch logs ==="
          docker logs datadatdat-docker-launch 2>&1 || echo "No launch container found"
          echo ""
          echo "=== Docker containers ==="
          docker ps -a
          echo ""
          echo "=== d3 config ==="
          cat ~/.datadatdat/config 2>/dev/null || echo "No config found"

      - name: Cleanup Docker resources
        if: always()
        run: |
          echo "Cleaning up Docker resources..."
          docker system prune -af --volumes
          df -h
  
  create-release:
    name: Create GitHub Release
    needs: e2e-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/darwin-amd64/datadatdat-cli-${{ github.ref_name }}-darwin_amd64.zip
            release/darwin-arm64/datadatdat-cli-${{ github.ref_name }}-darwin_arm64.zip
            release/linux-amd64/datadatdat-cli-${{ github.ref_name }}-linux_amd64.tar
            release/linux-arm64/datadatdat-cli-${{ github.ref_name }}-linux_arm64.tar
            release/windows/datadatdat-cli-${{ github.ref_name }}-windows_amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
