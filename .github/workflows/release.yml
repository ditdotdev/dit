name: Release
#
# Triggers:
#
#   push of a v* tag
#       Full release: build cross-platform binaries, run E2E, and publish a
#       GitHub Release. This is the normal release path.
#
#   workflow_dispatch
#       Dry run: build + E2E only. The create-release job is gated on
#       github.event_name == 'push', so manually-dispatched runs never
#       publish a release regardless of inputs. Use this to validate
#       workflow or build changes against master without shipping
#       anything externally.
#
#       Run from CLI:
#           gh workflow run release.yml --ref master
#
#       The dry run defaults VERSION to the latest reachable tag
#       (`git describe --tags --abbrev=0`) so the CLI binary's image
#       pulls (`ditdotdev/dit:$VERSION`) hit a tag that's
#       actually published on Docker Hub. Override only when you need
#       to test a specific published version:
#           gh workflow run release.yml --ref master -f version=v1.9.0
#
#       (Picking a version that is NOT published will fail E2E at
#       `dit install` time when it tries to pull the missing image.)
#
#       Built binaries appear in the workflow run's artifacts panel
#       (1-day retention) for inspection. No Release entry is created
#       and no release notifications fire to followers.
#
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version for dry-run (defaults to latest reachable tag, which must be a published Docker image).'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  health:
    uses: ditdotdev/.github/.github/workflows/repo-health.yml@master
    with:
      language: go
      coverage-floor: 90
      mode: block
    secrets:
      GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}

  build:
    name: Build Release Artifacts
    needs: health
    runs-on: ubuntu-22.04
    steps:
      # fetch-depth: 0 makes tags available so the dry-run path can
      # `git describe --tags --abbrev=0` to find a published version.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
      
      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
      
      - name: Configure Go for private modules
        run: |
          go env -w GOPRIVATE=github.com/ditdotdev/*
          go env -w GONOPROXY=github.com/ditdotdev/*
          go env -w GONOSUMDB=github.com/ditdotdev/*
          go env -w GOPROXY=https://proxy.golang.org,direct
      
      - name: Build cross-platform releases
        run: |
          # On tag push, derive VERSION from the tag. On workflow_dispatch
          # (dry run), use the version input or fall back to the latest
          # reachable tag — the latter ensures `ditdotdev/dit:$VERSION`
          # is a real Docker Hub tag that the E2E `dit install` step can pull.
          # See top-of-file header for the dry-run trigger model.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(git describe --tags --abbrev=0)
              echo "Dry run defaulting to latest tag: $VERSION"
            fi
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          make clean
          VERSION=$VERSION make release
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          retention-days: 1
  
  e2e-test:
    name: End-to-End Tests
    needs: build
    runs-on: ubuntu-22.04
    steps:
      # fetch-depth: 0 mirrors the build job: tags need to be available
      # so the dry-run version derivation can resolve `git describe`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release/
      
      - name: Extract Linux binary
        run: |
          # Mirror the build job's VERSION derivation so the tarball name
          # matches whether this run is a tag push or a dry-run dispatch.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(git describe --tags --abbrev=0)
            fi
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          cd release/linux-amd64
          tar -xf dit-cli-$VERSION-linux_amd64.tar
          chmod +x dit
          ./dit --version
          # Create symlink in repo root for tests (they expect $REPO_ROOT/dit)
          cd ../..
          ln -s release/linux-amd64/dit dit
      
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove unnecessary preinstalled software
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h
      
      - name: Install BATS
        run: sudo npm install -g bats
      
      - name: Install OpenZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
      
      - name: Generate SSH test keys
        run: |
          cd tests/endtoend/remotes/ssh
          bash generateKey.sh ubuntu-22.04
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Local kubernetes cluster for the kubernetes-tests.bats suite that
      # `make e2e` now includes. The suite auto-skips when the cluster is
      # absent, but we want the release path to exercise the k8s provider
      # before publishing artifacts.
      #
      # driver=none (kubeadm directly on the runner host) instead of the
      # docker driver: the docker driver runs the apiserver inside a
      # container on minikube's private network (192.168.49.2:8443),
      # which the dit server container — running on its own docker bridge
      # — has no route to. CreateVolume / CreatePVC then fails with a
      # 500 from inside the dit server. driver=none puts the apiserver on
      # the host network where every container can reach it.
      - name: Setup minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: none

      - name: Verify kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # Enable CSI snapshot support so kubernetes-tests.bats can exercise
      # `dit commit` against the release artifacts. See pull-request.yml
      # for the longer rationale.
      - name: Enable CSI volume snapshots in minikube
        run: |
          minikube addons enable volumesnapshots
          minikube addons enable csi-hostpath-driver
          kubectl patch storageclass standard -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
          kubectl patch storageclass csi-hostpath-sc -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
          # csi-hostpath-snapclass also needs the default-class annotation
          # for dit's commitVolume to find a snapshot class. See
          # pull-request.yml for the longer rationale.
          kubectl patch volumesnapshotclass csi-hostpath-snapclass --type=merge -p '{"metadata":{"annotations":{"snapshot.storage.kubernetes.io/is-default-class":"true"}}}'

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Run E2E tests
        run: |
          export PATH=$PWD/release/linux-amd64:$PATH
          make e2e
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
      
      # Show container and k8s logs on every run: matches the same dump
      # pattern as pull-request.yml so release runs have the same baseline
      # for triage. Always-on (not failure-only) so passing runs leave
      # behind a known-good reference to diff against the next failure.
      - name: Show container and k8s logs
        if: always()
        run: |
          for c in $(docker ps -a --filter "name=dit" --format '{{.Names}}'); do
            echo "=== docker logs $c ==="
            docker logs "$c" 2>&1 | tail -200 || true
          done
          echo ""
          echo "=== Docker containers ==="
          docker ps -a || true
          echo ""
          echo "=== dit config ==="
          cat ~/.dit/config 2>/dev/null || echo "No config found"
          if kubectl cluster-info >/dev/null 2>&1; then
            echo "=== kubectl get all -A ==="
            kubectl get all -A || true
            echo "=== kubectl get pvc -A ==="
            kubectl get pvc -A || true
            echo "=== kubectl get storageclass ==="
            kubectl get storageclass || true
            echo "=== kubectl get events -A --sort-by=.lastTimestamp (last 50) ==="
            kubectl get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -50 || true
          fi
        shell: bash

      - name: Cleanup Docker resources
        if: always()
        run: |
          echo "Cleaning up Docker resources..."
          docker system prune -af --volumes
          df -h
  
  create-release:
    name: Create GitHub Release
    needs: e2e-test
    # Only publish on real tag pushes. workflow_dispatch runs are dry-run
    # only and stop after e2e-test. See top-of-file header for rationale.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/darwin-amd64/dit-cli-${{ github.ref_name }}-darwin_amd64.zip
            release/darwin-arm64/dit-cli-${{ github.ref_name }}-darwin_arm64.zip
            release/linux-amd64/dit-cli-${{ github.ref_name }}-linux_amd64.tar
            release/linux-arm64/dit-cli-${{ github.ref_name }}-linux_arm64.tar
            release/windows/dit-cli-${{ github.ref_name }}-windows_amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
